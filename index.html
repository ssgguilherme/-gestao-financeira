<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinanFlow - Gestão Financeira Pessoal & Controle</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="FinanFlow - Gestão Financeira Pessoal & Controle" />
    <meta name="description" content="Sistema de gestão financeira estilo Nubank/Inter com controle de contas, cartões de crédito, PIX, orçamentos, metas e segurança OWASP." />
    <meta name="keywords" content="gestao financeira, financas pessoais, orcamento, cartao de credito, pix, nubank" />
    <meta name="author" content="FinanFlow" />

    <!-- Anti-Cache Meta Tags & Unregister Service Workers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Garante desinstalação imediata de caches e service workers obsoletos no notebook e celular
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) { caches.delete(name); }
        });
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#10b981" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#10b981" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinanFlow - Gestão Financeira Pessoal" />
    <meta property="og:description" content="Sistema completo de gestão financeira com controle de saldo, cartões, PIX, metas e segurança." />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
