<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FinanFlow - Gestão Financeira Pessoal & Controle</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="FinanFlow - Gestão Financeira Pessoal & Controle" />
    <meta name="description" content="Sistema de gestão financeira estilo Nubank/Inter com controle de contas, cartões de crédito, PIX, orçamentos, metas e segurança OWASP." />
    <meta name="keywords" content="gestao financeira, financas pessoais, orcamento, cartao de credito, pix, nubank" />
    <meta name="author" content="FinanFlow" />

    <!-- Web App Manifest & PWA Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Mobile & PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanFlow" />
    <meta name="application-name" content="FinanFlow" />

    <!-- Service Worker Registration for PWA Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[PWA] SW register:', err);
          });
        });
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#10b981" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#10b981" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinanFlow - Gestão Financeira Pessoal" />
    <meta property="og:description" content="Sistema completo de gestão financeira com controle de saldo, cartões, PIX, metas e segurança." />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
