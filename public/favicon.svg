<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="finan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="finan-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="finan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="140" fill="url(#finan-bg)" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="256" r="230" fill="url(#finan-glow)"/>

  <!-- Diamond / Shield Badge -->
  <g filter="url(#soft-shadow)">
    <rect x="146" y="146" width="220" height="220" rx="64" fill="url(#finan-emerald)" transform="rotate(45 256 256)"/>
  </g>

  <!-- Upward Trend Line & Arrow -->
  <path d="M 176 304 L 230 248 L 278 290 L 336 210" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 300 210 L 336 210 L 336 246" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Four-point Sparkle Star -->
  <path d="M 200 170 Q 200 190 180 190 Q 200 190 200 210 Q 200 190 220 190 Q 200 190 200 170 Z" fill="#ffffff"/>
</svg>
