<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card / Shield -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-grad)" stroke="#334155" stroke-width="8"/>
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="url(#emerald-grad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Financial Wallet & Trending Growth Graph Motif -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Shield / Diamond Emerald Base -->
    <path d="M 0 -130 L 110 -60 L 110 60 L 0 130 L -110 60 L -110 -60 Z" fill="url(#emerald-grad)"/>

    <!-- Inner Currency / Dollar & Trending Arrow Symbol -->
    <path d="M -50 30 L -10 -10 L 20 20 L 60 -30 M 35 -30 L 60 -30 L 60 -5" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Coin Sparkle -->
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
  </g>

  <!-- Decorative Accent Pill Bar -->
  <rect x="176" y="416" width="160" height="12" rx="6" fill="url(#accent-grad)"/>
</svg>
